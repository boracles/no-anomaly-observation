<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -16 287 72">
  <title>OFFFRAME</title>
  <defs>
    <radialGradient id="light" cx="58%" cy="33%" r="64%">
      <stop stop-color="#7fe7ff" stop-opacity=".82"/>
      <stop offset=".46" stop-color="#2364ed" stop-opacity=".56"/>
      <stop offset="1" stop-color="#102453" stop-opacity="0"/>
    </radialGradient>
    <filter id="echo" x="-15%" y="-90%" width="130%" height="280%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="soft-edge" x="-5%" y="-18%" width="110%" height="136%">
      <feGaussianBlur stdDeviation=".24"/>
    </filter>
    <text id="letters" x="9" y="37" textLength="239" lengthAdjust="spacingAndGlyphs"
          font-family="Avenir Next, Avenir, Trebuchet MS, sans-serif"
          font-size="53" font-weight="650" font-style="italic" letter-spacing="-2.4">offframe</text>
  </defs>
  <ellipse cx="135" cy="20" rx="139" ry="35" fill="url(#light)"/>
  <use href="#letters" fill="#5bbdff" opacity=".72" transform="translate(1 2)" filter="url(#echo)"/>
  <use href="#letters" fill="#edf0ff" filter="url(#soft-edge)"/>
</svg>
