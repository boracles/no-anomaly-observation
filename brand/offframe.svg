<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -16 287 72">
  <title>OFFFRAME</title>
  <defs>
    <filter id="refraction" x="-12%" y="-60%" width="124%" height="220%">
      <feTurbulence type="fractalNoise" baseFrequency=".011 .024" numOctaves="1" seed="7" result="ripples"/>
      <feDisplacementMap in="SourceGraphic" in2="ripples" scale="22" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <g id="letters" filter="url(#refraction)">
      <text x="9" y="37" textLength="239" lengthAdjust="spacingAndGlyphs"
          font-family="Avenir Next, Avenir, Trebuchet MS, sans-serif"
          font-size="53" font-weight="600" font-style="italic" letter-spacing="-2.4">offframe</text>
    </g>
    <radialGradient id="wash">
      <stop stop-color="#fff"/>
      <stop offset=".48" stop-color="#fff" stop-opacity=".92"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".47"/>
    </radialGradient>
    <linearGradient id="paper" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".54"/>
      <stop offset=".46" stop-color="#fff" stop-opacity=".83"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".39"/>
    </linearGradient>
    <mask id="ink-density" maskUnits="userSpaceOnUse" x="-14" y="-16" width="287" height="72" style="mask-type:alpha">
      <rect x="-14" y="-16" width="287" height="72" fill="url(#paper)"/>
      <ellipse cx="33" cy="25" rx="39" ry="16" fill="url(#wash)"/>
      <ellipse cx="119" cy="11" rx="48" ry="17" fill="url(#wash)"/>
      <ellipse cx="209" cy="26" rx="49" ry="13" fill="url(#wash)"/>
    </mask>
    <linearGradient id="ink" x1="0" y1=".7" x2="1" y2=".3">
      <stop stop-color="#bdc9fd"/>
      <stop offset=".32" stop-color="#e7dcfa"/>
      <stop offset=".65" stop-color="#dceee1"/>
      <stop offset="1" stop-color="#adbdf9"/>
    </linearGradient>
  </defs>
  <use href="#letters" fill="url(#ink)" mask="url(#ink-density)"/>
</svg>
