<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -16 287 72">
  <title>OFFFRAME</title>
  <defs>
    <filter id="refraction" x="-12%" y="-60%" width="124%" height="220%">
      <feTurbulence type="fractalNoise" baseFrequency=".019 .044" numOctaves="1" seed="7" result="ripples"/>
      <feDisplacementMap in="SourceGraphic" in2="ripples" scale="24" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation=".35"/>
    </filter>
    <g id="letters" filter="url(#refraction)">
      <text x="9" y="37" textLength="239" lengthAdjust="spacingAndGlyphs"
          font-family="Avenir Next, Avenir, Trebuchet MS, sans-serif"
          font-size="53" font-weight="650" font-style="italic" letter-spacing="-2.4">offframe</text>
    </g>
  </defs>
  <use href="#letters" fill="#edf0f3"/>
</svg>
