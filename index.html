<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101112">
<link rel="icon" href="brand/offframe-icon.svg" type="image/svg+xml">
<title>OFFFRAME</title>
<style>
:root{color-scheme:dark;--ink:#f1eef4;--dim:#b3aebc;--line:#272c32;--bg:#101112;--surface:#1a1e22;--accent:#aacced;--blue:#b5d5f1}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
button,a,input,textarea{font:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.55}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
a{color:inherit;text-decoration:none}
svg{width:24px;height:24px;display:block;stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
h1,h2,p,figure{margin:0}
.muted{color:var(--dim)}
.rail{position:fixed;inset:0 auto 0 0;width:64px;padding:28px 9px 17px;display:flex;flex-direction:column;align-items:center;background:var(--bg);z-index:2}
.brand{display:flex;align-items:center;gap:9px;font-size:24px;font-weight:900;letter-spacing:-.085em;width:max-content}
.brand-icon{display:block;width:30px;height:30px}
.feed-identity::before{
 content:"";position:absolute;z-index:-1;pointer-events:none;inset:-14px 5% -12px 2%;
 background:radial-gradient(ellipse at 29% 21%,#70e3ff82,transparent 53%),radial-gradient(ellipse at 50% 58%,#1674f095,transparent 65%),radial-gradient(ellipse at 38% 77%,#3236c67a,transparent 70%);
 filter:blur(14px);mask-image:radial-gradient(ellipse at 41% 46%,#000 17%,transparent 73%);
}
.feed-identity h1{display:flex;align-items:center;gap:9px}
.feed-identity .wordmark{display:block;width:clamp(194px,37vw,287px);height:auto;margin:-15px -13px}
.story .all .brand-icon{width:42%;height:auto}
.account-avatar .brand-icon{width:100%;height:100%}
.rail .brand{padding:8px}
.rail .brand span{display:none}
.nav{display:grid;gap:18px;margin-top:clamp(15px,20vh,210px);margin-bottom:auto}
.nav svg,.railfoot svg{width:26px;height:26px}
.nav button,.railfoot a{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:#15181e}
.nav button:hover,.railfoot a:hover{background:var(--surface)}
.nav .selected{background:#23262c}
.nav .selected svg{stroke-width:2.4}

.nav .label,.railfoot .label{display:none}
.mobilebar{display:none}
.shell{padding:30px 24px 64px}
.layout{display:block;width:min(100%,632px);margin-inline:auto}
body:not(.wall){background-color:#08090b}
body:not(.wall)::before{
 content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
 background:linear-gradient(to bottom,#000 0%,#0000 clamp(56px,12vh,120px),#0000 calc(100% - clamp(68px,14vh,144px)),#000 100%);
}

.stream{min-width:0}
.feed-identity{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:end;padding:0 24px 19px}
.feed-identity h1{font-size:clamp(35px,6vw,54px);line-height:.98;letter-spacing:-.09em}
.feed-identity small{display:block;color:#b6bdce;font-size:13px;margin-bottom:7px}
.feed-identity span{color:var(--dim);font-size:12px}
.wall .feed-identity{display:none}
.stream{min-width:0}
.feedheader{display:flex;align-items:center;justify-content:space-between;gap:10px;width:min(100%,576px);margin-inline:auto}
.feedheader:has(.toolbar-title:empty){display:none}
.toolbar-title{font-weight:700}
.toolbar-title:empty{display:none}
.toolbar-title{font-size:12px;color:var(--dim)}
.stories{display:flex;gap:14px;padding:4px 24px 24px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.story{position:relative;display:grid;flex:0 0 clamp(108px,29vw,142px);aspect-ratio:1;min-width:0;padding:0;border-radius:50%;scroll-snap-align:center;--rim:#bac7e0}
.story:nth-child(1){--rim:#fba184}
.story:nth-child(2){--rim:#a5a6ff}
.story:nth-child(3){--rim:#8dd8d7}
.story:nth-child(4){--rim:#e9a8d8}
.story strong{position:absolute;z-index:1;bottom:16%;inset-inline:8%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:650;color:white;text-shadow:0 1px 8px #000,0 1px 2px #000}
.story .pic{position:relative;display:grid;place-items:center;width:100%;height:100%;border-radius:50%;overflow:hidden;background:#222b35}
.story .pic::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;border:1px solid color-mix(in srgb,var(--rim),transparent 27%);box-shadow:inset 0 0 21px 5px color-mix(in srgb,var(--rim),transparent 24%),inset 4px 6px 18px #ffffff6c;background:linear-gradient(150deg,#f6efda29,transparent 42%,#0709139e)}
.story img,.story .all{width:100%;height:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:#171b20;color:white}
.entries{display:grid;gap:21px;width:min(calc(100% - 24px),600px);margin-inline:auto}
.post{min-width:0;border-bottom:1px solid var(--line);padding-bottom:13px;scroll-margin-top:22px}
.posthead{display:flex;align-items:center;gap:9px;padding:7px 9px 11px}
.avatar{display:block;width:38px;height:38px;flex:0 0 auto;object-fit:cover;border-radius:50%;background:#211c26}
.handle{display:flex;align-items:baseline;gap:6px;line-height:1.3}
.posthead strong,.caption strong{font-weight:750}
.posthead small{display:block;font-size:11px}
.stamp{color:var(--dim);font-size:12px;white-space:nowrap}
.postphoto{position:relative;isolation:isolate;background:#191620;aspect-ratio:4/5;overflow:hidden;border-radius:21px}
.postphoto img{width:100%;height:100%;object-fit:cover;display:block}
.pointer-haze{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.pointer-haze span{position:absolute;top:0;left:0;width:100px;height:100px;border-radius:50%;opacity:0;background:#bbc9df30;backdrop-filter:blur(15px);mask-image:radial-gradient(circle,#000 15%,#000b 39%,transparent 71%)}
@media(prefers-reduced-motion:reduce),(hover:none){.pointer-haze{display:none}}
.postbody{padding:7px 9px 0}
.actions{display:flex;gap:14px;align-items:center;margin-bottom:3px}
.actions button{padding:4px 0;display:flex;align-items:center}
.actions button:hover{color:var(--dim)}
.actions .like[aria-pressed=true]{color:#f16691}
.actions button[aria-pressed=true] svg{stroke-width:2.6}
.actions .bookmark[aria-pressed=true]{color:var(--accent)}
.actions .bookmark{margin-left:auto}
.likes{display:block;margin-bottom:4px}
.caption,.commentlist{word-break:keep-all;overflow-wrap:anywhere}
.caption strong,.commentlist strong{margin-right:6px}
.tags{color:#adbaf0;margin-top:3px;font-size:13px}
.commentlist{display:grid;gap:3px;margin-top:4px;font-size:13px}
.reply-toggle{color:var(--dim);padding:6px 0 0;text-align:left;font-size:13px}
.commentform{display:flex;gap:9px;margin-top:8px}
.commentform input{flex:1;min-width:0;border:0;padding:3px 0;background:transparent}
.commentform button{color:var(--blue);font-size:13px;font-weight:700;padding:3px 0}
.commentform button:disabled{visibility:hidden}
.empty{padding:30px 10px;text-align:center;color:var(--dim)}
.account{display:flex;align-items:center;gap:10px}
.account-avatar{display:grid;place-items:center;color:white}
.account small{display:block;color:var(--dim);font-size:12px}
.people{display:grid;gap:13px;width:min(100%,576px);margin:0 auto 16px;padding:12px 14px;border-bottom:1px solid var(--line)}
.people .avatar{width:33px;height:33px}
.people button{margin-left:auto;color:var(--blue);padding:6px 0;font-size:12px;font-weight:700}
.people button[aria-pressed=true]{color:var(--dim)}
.post-options{margin-left:auto}
.post-options summary{display:grid;place-items:center;cursor:pointer;list-style:none;padding:5px}
.post-options summary::-webkit-details-marker{display:none}
.post-options{position:relative}
.post-options button{position:absolute;z-index:1;right:0;width:max-content;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 8px #0002;padding:8px 12px}
.actions .like{gap:5px}
.actions .like span{color:var(--ink);font-size:13px;font-weight:700}
.wall .likes{display:block}
body:not(.wall) .likes{display:none}
.story-view{width:min(430px,calc(100% - 20px));background:#111;color:white;border:0;border-radius:12px;overflow:hidden}
.story-stage{position:relative;display:grid;align-items:end;aspect-ratio:9/15;max-height:calc(100dvh - 20px);isolation:isolate}
.story-stage::after{content:"";position:absolute;inset:0;background:linear-gradient(#000a,transparent 24%,transparent 65%,#000d);z-index:-1}
.story-stage>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.story-top{position:absolute;inset:12px 12px auto}
.story-progress{display:flex;gap:4px;margin-bottom:9px}
.story-progress span{height:2px;flex:1;background:#fff6}
.story-progress .seen{background:white}
.story-person{display:flex;align-items:center;gap:8px}
.story-person .avatar{width:29px;height:29px}
.story-person button{margin-left:auto;padding:5px;font-size:18px}
.story-tap{position:absolute;top:62px;bottom:84px;width:36%;font-size:21px;color:white;text-shadow:0 1px 5px #000}
.story-tap:first-of-type{left:0;text-align:left;padding-left:13px}
.story-tap:last-of-type{right:0;text-align:right;padding-right:13px}
.story-note{padding:14px 15px 18px;font-size:14px}
.story-note button{display:block;margin-top:8px;padding:0;color:white;text-decoration:underline;text-underline-offset:3px;font-size:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);width:max-content;border-radius:8px;background:#252228;color:white;padding:10px 14px;z-index:3}
.wall{color-scheme:dark;--bg:#101011;--ink:#fff;--dim:#b8b7ba;--line:#424047}
.wall :is(.rail,.stories,.actions,.mobilebar,.reply-toggle,.commentform,.post-options){display:none}
.wall .shell{margin:0}
.wall .layout{display:block;max-width:1440px;margin:auto}
.wall .entries{width:100%;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));margin-top:20px}
.wall .toolbar-title{font-size:24px;font-weight:750;color:var(--ink)}
.wall .postphoto{aspect-ratio:16/9}
.wall .postphoto img{object-fit:contain}
.wall .tags{color:#b9caeb}
dialog{width:min(525px,calc(100% - 24px));max-height:calc(100% - 24px);padding:0;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:14px}
dialog::backdrop{background:#0009}
.dialoghead{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--line)}
.dialoghead h2{font-size:16px}
.dialogbody{padding:15px;display:grid;gap:10px}
.choice,.inbox{display:flex;gap:6px;overflow:auto}
.choice button[aria-pressed=true],.inbox button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.preview{background:var(--surface);aspect-ratio:16/9;display:grid;place-items:center;text-align:center;color:var(--dim);overflow:hidden;border-radius:6px}
.preview img,.inbox img{width:100%;height:100%;object-fit:cover;display:block}
.inbox button{border:1px solid var(--line);padding:3px;flex:0 0 85px;aspect-ratio:16/9;border-radius:5px}
textarea,input,.ghost{color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 10px}
input::placeholder,textarea::placeholder{color:var(--dim);opacity:1}
textarea{width:100%;min-height:64px;resize:vertical}
.primary{border-radius:7px;padding:7px 17px;background:var(--blue);color:#151927;font-weight:750}
.formend{display:flex;justify-content:space-between;align-items:center}
@media(min-width:901px){body:not(.wall) .layout{position:relative;left:-14px}}
@media(max-height:640px){.nav{margin-top:auto;gap:5px}}
@media(min-width:601px) and (max-width:900px){
 .shell{padding-left:80px}
 .story{width:86px}
}
@media(max-width:600px){
 .rail{inset:auto 0 0;width:auto;border-top:1px solid var(--line);display:block;padding:3px 12px max(3px,env(safe-area-inset-bottom))}
 .rail .brand,.railfoot{display:none}
 .nav{display:flex;justify-content:space-around;gap:0;margin:0}
 .mobilebar{display:flex;position:absolute;right:19px;top:20px;z-index:2}
 .mobilebar .brand{display:none}
 .mobilebar a{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#181c25}
 .mobilebar svg{width:20px;height:20px}
 .shell{padding:22px 0 74px}
 .layout{max-width:470px}
 .feed-identity{padding:0 17px 15px}
 .feed-identity span{display:none}
 .feedheader{padding-inline:14px}
 .stories{gap:9px;padding:3px 15px 17px}
 .story{flex-basis:clamp(98px,29vw,135px)}
 .story strong{font-size:11px}
 .postphoto{border-radius:19px;aspect-ratio:1.29}
 .postphoto.gap-view{aspect-ratio:1}
 .wall .postphoto{aspect-ratio:16/9}
 .toast{bottom:62px}
 .wall .shell{padding-inline:12px}
}
</style>
</head>
<body>

 <symbol id="i-more" viewBox="0 0 24 24"><g stroke="none" fill="currentColor"><circle cx="5" cy="12" r="1.65"/><circle cx="12" cy="12" r="1.65"/><circle cx="19" cy="12" r="1.65"/></g></symbol>

<header class="mobilebar">
<a class="brand" href="./" aria-label="OFFFRAME home"><img class="brand-icon" src="brand/offframe-icon.svg" alt=""><span>OFFFRAME</span></a>
<a href="?wall=1" id="wall-mobile" aria-label="Exhibition feed"><svg aria-hidden="true"><use href="#i-wall"/></svg></a>
</header>
<nav class="rail" aria-label="Main navigation">
<a class="brand" href="./" aria-label="OFFFRAME home"><img class="brand-icon" src="brand/offframe-icon.svg" alt=""><span>OFFFRAME</span></a>
<div class="nav">
<button id="home" class="selected" aria-label="Home"><svg aria-hidden="true"><use href="#i-home"/></svg><span class="label">Home</span></button>
<button id="open-compose" aria-label="New post"><svg aria-hidden="true"><use href="#i-compose"/></svg><span class="label">New post</span></button>
<button id="saved-nav" aria-label="Saved"><svg aria-hidden="true"><use href="#i-save"/></svg><span class="label">Saved</span></button>
<button id="following-tab" aria-label="Following" aria-pressed="false"><svg aria-hidden="true"><use href="#i-people"/></svg></button>
</div>
<div class="railfoot"><a id="wall-link" href="?wall=1" target="_blank" rel="noopener" aria-label="Exhibition feed"><svg aria-hidden="true"><use href="#i-wall"/></svg></a></div>
</nav>
<main class="shell"><div class="layout">
<section class="stream" aria-label="OFFFRAME feed">
<div class="feed-identity"><div><small>Same night. Different views.</small><h1><img class="wordmark" src="brand/offframe.svg?v=soft-focus" alt="OFFFRAME"></h1></div><span>@offframe</span></div>
<header class="feedheader">
<span class="toolbar-title" id="view-title"></span>
</header>
<div id="stories" class="stories" aria-label="Stories"></div>
<div id="mobile-people" class="people" hidden></div>
<div id="entries" class="entries"></div>
</section>
</div></main>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="story-view" class="story-view" aria-label="Story">
<div class="story-stage">
<img id="story-image" alt="Story photo">
<div class="story-top"><div class="story-progress" id="story-progress" aria-hidden="true"></div>
<div class="story-person"><img class="avatar" id="story-avatar" alt=""><strong id="story-name"></strong><span id="story-time"></span><button id="story-close" aria-label="Close story">×</button></div></div>
<button class="story-tap" id="story-prev" aria-label="Previous story">‹</button>
<button class="story-tap" id="story-next" aria-label="Next story">›</button>

</div>
</dialog>

<div class="dialoghead"><h2 id="compose-title">New post</h2><button type="button" id="close-compose" class="ghost" aria-label="Close">✕</button></div>

<div class="choice" id="choices"></div><div class="inbox" id="inbox" hidden></div>

<script>
document.body.prepend(document.querySelector('#icons').content.cloneNode(true));
const views={
 A:{name:'Edge of the rain',tag:'#rainline',image:'stills/a.jpg'},
 B:{name:'Street level',tag:'#reflection',image:'stills/b.jpg'},
 C:{name:'Beside the sheet',tag:'#whitesheet',image:'stills/c.jpg'}
};
const observers=[
 {view:'C',name:'cloth.under',location:'Alley entrance',avatar:'profiles/cloth.jpg'},
 {view:'A',name:'rooftop_03',location:'Upstairs',avatar:'profiles/rooftop.jpg'},
 {view:'B',name:'drainline',location:'Street level',avatar:'profiles/drainline.jpg'},
 {view:'B',name:'fish.on.shelf',location:'Outside the shop',avatar:'profiles/fish.jpg'}
];
const [cloth,roof,drain,fish]=observers;
const nickname='offframe';
let storyIndex=0;
const seed=[
 {id:'seed-c',...cloth,gapView:true,tag:'#underthestreetlight',image:'stills/alley-rain.jpg',imageAlt:'Rain under a streetlight, seen through a gap between walls',story:'I put the clip in my pocket after taking this. Then I heard another one drop by the door.',storyImage:'stills/clothespin.jpg',ago:'Just now',
  text:'Took this through the gap on my way home. It was pouring under the streetlight. The ground where I stood was dry.',likes:12,
  comments:[{name:drain.name,text:'From the other side it looked like the rain went past the light.'},{name:roof.name,text:'From up here I could only see the wet ground. Is that the same spot?'}]},
 {id:'seed-fish',...fish,tag:'#shopfront',image:'stills/milk.jpg',imageAlt:'A bottle of banana milk and a receipt',story:'Anyone leave a receipt? I will put it by the register.',storyImage:'stills/milk.jpg',ago:'4 min ago',
  text:'Found this outside at closing. I cleared away the milk. The receipt is by the register.',likes:5,
  comments:[{name:cloth.name,text:'I picked up a clothespin there earlier. No milk, though.'},{name:fish.name,text:'Right outside the shop? The ground here stayed dry the whole time.'}]},
 {id:'seed-a',...roof,gapView:true,image:'stills/curtain-rain.jpg',imageAlt:'Wet pavement viewed from upstairs through a gap in the curtains',story:'Was that umbrella closed earlier too?',storyImage:'stills/umbrella.jpg',ago:'9 min ago',
  text:'Pulled the curtains apart a little. This window was dry, but it was pouring past the streetlight. Closing the window did nothing to the sound.',likes:21,
  comments:[{name:drain.name,text:'From down there I could see rain by the window too.'},{name:roof.name,text:'I wiped the glass. The drops were on the inside.'}]},
 {id:'seed-patch',...drain,image:'stills/patch.jpg',imageAlt:'A rectangular wet patch under a streetlight',story:'The cat turned around right at that line.',storyImage:'stills/patch.jpg',ago:'17 min ago',
  text:'Saw water pooling under one lamp on the way home. I stepped around it, then looked back. The edge was almost a perfect rectangle.',likes:8,
  comments:[{name:fish.name,text:'That lamp went out earlier. Its reflection stayed lit for a while.'},{name:cloth.name,text:'I saw water running out of it. You cannot really see that in the photo.'}]},
 {id:'seed-pin',...cloth,image:'stills/clothespin.jpg',tag:'#clothespin',imageAlt:'A wooden clothespin held in one hand',ago:'31 min ago',
  text:'Another clothespin fell. I left one on the line, but this one is a slightly different color from ours.',likes:7,
  comments:[{name:roof.name,text:'Just checked from upstairs. There are clips at both ends.'},{name:cloth.name,text:'I swear I left just the one lol'}]},
 {id:'seed-b',...drain,tag:'#closedumbrella',image:'stills/umbrella.jpg',imageAlt:'A closed blue umbrella at the entrance to the alley',ago:'43 min ago',
  text:'This alley saves me three minutes. Took the long way tonight. I kept hearing something fall and could never tell where it landed.',likes:9,
  comments:[{name:roof.name,text:'I just saw water hit the window. Did not hear a thing.'},{name:fish.name,text:'Heard one rush of water with the door open. Then it happened again after I shut it.'}]},
 {id:'seed-window',...roof,image:'stills/window.jpg',imageAlt:'A white sheet on a railing beyond the window',ago:'1 hour ago',
  text:'Someone left a sheet on the railing. I wiped the fog off the glass and saw it was still dry outside.',likes:14,
  comments:[{name:cloth.name,text:'I took that in last night.'},{name:drain.name,text:'I was already getting soaked in the alley by then.'}]}
];
const stories=observers.map(person=>seed.find(entry=>entry.name===person.name&&entry.story));
const params=new URLSearchParams(location.search);
const venue=params.get('venue')==='1', wall=params.has('wall');
const assigned=Object.hasOwn(views,params.get('station'))?params.get('station'):null;
const postKey='no-anomaly-records-v1', actionKey='no-anomaly-actions-v2', followKey='no-anomaly-following-v1';
const $=id=>document.getElementById(id);
function load(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
let reports=venue?[]:load(postKey,[]),actions=load(actionKey,{}),following=load(followKey,[]);
let filter='all',mode='feed',selected=assigned||'A',capture=null,inboxKey='',busy=false,openedComment=null,toastTimer;
function save(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch{return false}}
function make(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node}
function image(url,alt){const node=new Image();node.src=url;node.alt=alt;return node}
function brandIcon(){const mark=image('brand/offframe-icon.svg','');mark.className='brand-icon';return mark}
function icon(id){const node=document.createElementNS('http://www.w3.org/2000/svg','svg');node.setAttribute('aria-hidden','true');const use=document.createElementNS(node.namespaceURI,'use');use.setAttribute('href','#i-'+id);node.append(use);return node}
function notify(message){
 $('toast').textContent=message;
 $('toast').hidden=false;
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>$('toast').hidden=true,2300);
}
function setFilter(value,nextMode='feed'){
 filter=value;mode=nextMode;
 $('following-tab').setAttribute('aria-pressed',String(mode==='following'));
 $('home').classList.toggle('selected',mode==='feed');
 $('following-tab').classList.toggle('selected',mode==='following');
 $('saved-nav').classList.toggle('selected',mode==='saved');
 $('view-title').textContent=mode==='saved'?'Saved posts':mode==='following'?'Following':assigned?'Camera '+assigned:'';
 $('mobile-people').hidden=mode!=='following';
 renderStories();renderFeed();
}
function renderPeople(){
 const target='mobile-people';
 $(target).replaceChildren(...observers.map(person=>{
  const row=make('div','account'),avatar=image(person.avatar,'');
  avatar.className='avatar';
  const by=make('div');by.append(make('strong','',person.name),make('small','',person.location));
  const followed=following.includes(person.name),button=make('button','',followed?'Following':'Follow');
  button.setAttribute('aria-pressed',String(followed));
  button.setAttribute('aria-label','Follow '+person.name);
  button.onclick=()=>{
   following=followed?following.filter(name=>name!==person.name):[...following,person.name];
   save(followKey,following);
   renderPeople();renderFeed();
   $(target).querySelectorAll('button')[observers.indexOf(person)].focus();
  };
  row.append(avatar,by,button);return row;
 }));
}
function renderStories(){
 const all={view:'all',name:'All'};
 const accounts=venue?[cloth,roof,drain]:observers;
 $('stories').hidden=mode!=='feed';
 $('stories').replaceChildren(...(venue?[all,...accounts]:accounts).map(({view,name,avatar})=>{
  const button=make('button','story');if(venue||view==='all')button.setAttribute('aria-pressed',String(filter===view));
  else button.setAttribute('aria-haspopup','dialog');
  const photo=make('span','pic');
  if(view==='all'){
   const mark=make('span','all');mark.append(brandIcon());photo.append(mark);
  }else photo.append(image(avatar,''));
  button.append(photo,make('strong','',name));
  button.onclick=()=>{
   if(view==='all'||venue){setFilter(view);$('stories').querySelector('[aria-pressed="true"]').focus();return}
   showStory(stories.findIndex(entry=>entry.name===name));$('story-view').showModal();
  };
  if(view!=='all'&&!venue)button.setAttribute('aria-label',name+' story');
  return button;
 }));
}
function showStory(index){
 if(index<0||index>=stories.length){$('story-view').close();return}
 storyIndex=index;
 const entry=stories[index];
 $('story-image').src=entry.storyImage;
 $('story-avatar').src=entry.avatar;
 $('story-name').textContent=entry.name;
 $('story-time').textContent='· '+entry.ago;
 $('story-caption').textContent=entry.story;
 $('story-prev').hidden=index===0;
 $('story-next').textContent=index===stories.length-1?'×':'›';
 $('story-next').setAttribute('aria-label',index===stories.length-1?'Close story':'Next story');
 $('story-progress').replaceChildren(...stories.map((_,i)=>make('span',i<=index?'seen':'')));
}
$('story-close').onclick=()=>$('story-view').close();
$('story-prev').onclick=()=>showStory(storyIndex-1);
$('story-next').onclick=()=>showStory(storyIndex+1);
$('story-post').onclick=()=>{
 $('story-view').close();
 $(`post-${stories[storyIndex].id}`)?.scrollIntoView({block:'start'});
};
$('story-view').addEventListener('keydown',event=>{
 if(event.key==='ArrowRight')showStory(storyIndex+1);
 if(event.key==='ArrowLeft'&&storyIndex>0)showStory(storyIndex-1);
});
async function sharePost(id){
 const url=new URL(location.href);url.hash='post-'+id;
 try{
  await navigator.clipboard.writeText(url.href);
  notify('Post link copied.');
 }catch{
  window.prompt('Post link',url.href);
 }
}
function postCard(entry){
 const view=views[entry.view],name=entry.name||nickname,id=entry.id;
 const state=actions[id]||{liked:false,comments:[]};
 const article=make('article','post'),head=make('div','posthead');
 article.id='post-'+id;
 const by=make('div'),handle=make('div','handle');
 handle.append(make('strong','',name),make('span','stamp','· '+(entry.ago||'Just now')));
 by.append(handle,make('small','',entry.location||'Alley'));
 const avatar=entry.avatar?image(entry.avatar,''):make('span','account-avatar');
 if(!entry.avatar)avatar.append(brandIcon());
 avatar.classList.add('avatar');
 const options=make('details','post-options'),summary=make('summary','');
 summary.setAttribute('aria-label','Post options');summary.append(icon('more'));
 const copy=make('button','','Copy post link');
 copy.onclick=()=>{options.open=false;sharePost(id)};
 options.append(summary,copy);
 head.append(avatar,by,options);
 const photo=make('figure',entry.gapView?'postphoto gap-view':'postphoto');
 const postImage=image(entry.image||view.image,entry.imageAlt||view.name);
 photo.append(postImage);
 const body=make('div','postbody'),buttons=make('div','actions');
 const like=make('button','like'),likes=make('strong','likes');
 const likeCount=make('span','');
 like.append(icon('pulse'),likeCount);like.setAttribute('aria-label','Like');
 function updateLike(){
  like.setAttribute('aria-pressed',String(Boolean(state.liked)));
  const count=(entry.likes||0)+(state.liked?1:0);
  likeCount.textContent=String(count);
  likes.textContent=count+' likes';
 }
 like.onclick=()=>{state.liked=!state.liked;actions[id]=state;save(actionKey,actions);updateLike()};
 updateLike();
 if(!wall)photo.ondblclick=event=>{if(event.target===postImage&&!state.liked)like.click()};
 const replies=[...(entry.comments||[]),...(state.comments||[])];
 const comments=make('button','');comments.append(icon('comment'));comments.setAttribute('aria-label','Comment');comments.setAttribute('aria-expanded',String(openedComment===id));
 const share=make('button','');share.append(icon('link'));share.setAttribute('aria-label','Copy post link');share.onclick=()=>sharePost(id);
 const bookmark=make('button','bookmark');bookmark.append(icon('save'));bookmark.setAttribute('aria-label','Save post');bookmark.setAttribute('aria-pressed',String(Boolean(state.saved)));
 bookmark.onclick=()=>{
  state.saved=!state.saved;actions[id]=state;save(actionKey,actions);
  bookmark.setAttribute('aria-pressed',String(state.saved));
  notify(state.saved?'Post saved.':'Post removed from saved.');
  if(mode==='saved')renderFeed();
 };
 comments.onclick=()=>{
  openedComment=openedComment===id?null:id;renderFeed();
  (document.getElementById('reply-'+id)||document.getElementById(article.id)?.querySelector('button[aria-label="Comment"]'))?.focus({preventScroll:!openedComment});
 };
 buttons.append(like,comments,share,bookmark);
 const caption=make('p','caption');caption.append(make('strong','',name),document.createTextNode(entry.text));
 body.append(buttons,likes,caption,make('p','tags',(entry.tag||view.tag)+'  #offframe'));
 if(replies.length>2&&openedComment!==id){
  const toggle=make('button','reply-toggle','View all '+replies.length+' comments');
  toggle.onclick=comments.onclick;
  body.append(toggle);
 }
 if(replies.length){
  const list=make('div','commentlist');
  for(const reply of (openedComment===id?replies:replies.slice(0,2))){const line=make('p');line.append(make('strong','',reply.name),document.createTextNode(reply.text));list.append(line)}
  body.append(list);
 }
 if(!wall){
  const form=make('form','commentform'),input=make('input','');
  input.id='reply-'+id;input.placeholder='Write a comment…';input.setAttribute('aria-label','Comment');input.maxLength=100;input.required=true;
  const replyButton=make('button','','Post');replyButton.disabled=true;
  input.oninput=()=>{replyButton.disabled=!input.value.trim()};
  form.append(input,replyButton);
  form.onsubmit=event=>{
   event.preventDefault();const value=input.value.trim();if(!value)return;
   state.comments=[...(state.comments||[]),{name:nickname,text:value}];actions[id]=state;save(actionKey,actions);
   openedComment=id;renderFeed();$('reply-'+id)?.focus({preventScroll:true});
  };
  body.append(form);
 }
 article.append(head,photo,body);return article;
}
function renderFeed(){
 const rows=(venue?reports:[...reports,...seed]).filter(entry=>{
  if(!views[entry.view])return false;
  if(mode==='saved')return actions[entry.id]?.saved;
  if(mode==='following')return following.includes(entry.name);
  return filter==='all'||entry.view===filter;
 });
 const message=mode==='saved'?'No saved posts yet.':mode==='following'?'Follow someone to see their posts here.':'No posts yet.';
 $('entries').replaceChildren(...(rows.length?rows.map(postCard):[make('p','empty',message)]));
}
function showLinkedPost(){
 const id=location.hash.slice(1);
 if(!id.startsWith('post-'))return;
 setFilter('all');
 $(id)?.scrollIntoView({block:'start'});
}
function updateCompose(){
 $('count').textContent=$('report').value.length+' / 100';
 $('publish').disabled=busy||!capture||!$('report').value.trim();
}
function preview(url,text){$('preview').replaceChildren(url?image(url,text):document.createTextNode(text))}
function pickView(key){
 selected=key;capture=null;
 for(const node of $('choices').children)node.setAttribute('aria-pressed',String(node.dataset.view===key));
 preview(views[key].image,views[key].name);$('capture-status').textContent='Select a photo to post.';updateCompose();
}
function openComposer(){
 if(venue&&!assigned)return;
 $('composer').showModal();
 if(venue){$('compose-title').textContent='Tablet '+assigned+' · New post';refreshVenue()}
}
for(const [key,view] of Object.entries(views)){
 if(assigned&&assigned!==key)continue;
 const button=make('button','ghost',venue?'Camera '+key:view.name);button.type='button';button.dataset.view=key;button.onclick=()=>pickView(key);$('choices').append(button);
}
$('capture').onclick=()=>{capture={view:selected};$('capture-status').textContent='Photo selected.';$('report').focus();updateCompose()};
$('open-compose').onclick=openComposer;
$('close-compose').onclick=()=>$('composer').close();
$('home').onclick=()=>{setFilter('all');window.scrollTo(0,0)};
$('following-tab').onclick=()=>setFilter('all','following');
$('saved-nav').onclick=()=>{setFilter('all','saved');window.scrollTo(0,0)};
$('report').oninput=updateCompose;
$('compose').onsubmit=async event=>{
 event.preventDefault();
 const message=$('report').value.trim();
 if(!capture||!message||busy)return;
 busy=true;updateCompose();
 try{
  if(venue){
   const response=await fetch('/api/publish/'+assigned,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:capture.id,text:message})});
   if(!response.ok)throw new Error('Could not publish');
   inboxKey='';await refreshVenue();
  }else{
   const next=[{id:crypto.randomUUID(),view:capture.view,name:nickname,text:message},...load(postKey,[])].slice(0,40);
   if(!save(postKey,next))throw new Error('Could not save');
   reports=next;
  }
  $('report').value='';capture=null;$('composer').close();setFilter('all');window.scrollTo(0,0);
 }catch{$('capture-status').textContent='Could not post. Check your connection and try again.'}
 finally{busy=false;updateCompose()}
};
async function refreshVenue(){
 try{
  const response=await fetch('/api/feed');if(!response.ok)throw Error();
  const next=await response.json();
  if(JSON.stringify(next)!==JSON.stringify(reports)){const firstFeed=!reports.length;reports=next;renderFeed();if(firstFeed&&!wall)showLinkedPost()}
  if(wall||!assigned)return;
  const pending=await fetch('/api/captures/'+assigned);if(!pending.ok)throw Error();
  const photos=await pending.json(),nextKey=photos.map(photo=>photo.id).join(',');
  if(inboxKey===nextKey)return;
  inboxKey=nextKey;
  if(capture&&!photos.some(photo=>photo.id===capture.id)){capture=null;updateCompose()}
  if(!capture)preview(null,photos.length?'Camera '+assigned+'. Choose an incoming photo.':'Camera '+assigned+' capture pending');
  $('inbox').replaceChildren(...photos.map((photo,i)=>{
   const button=make('button','');button.type='button';button.setAttribute('aria-label','Photo '+(i+1));
   button.setAttribute('aria-pressed',String(capture?.id===photo.id));button.append(image(photo.image,'Camera '+assigned+' capture'));
   button.onclick=()=>{capture=photo;for(const node of $('inbox').children)node.setAttribute('aria-pressed',String(node===button));preview(photo.image,'Camera '+assigned+' capture');$('report').focus();updateCompose()};
   return button;
  }));
 }catch{if(!wall)$('capture-status').textContent='Check the exhibition server connection.'}
}
if(venue){
 $('storage-note').hidden=true;
 $('wall-link').href=$('wall-mobile').href='?venue=1&wall=1';
 $('choices').hidden=$('capture').hidden=true;$('inbox').hidden=false;
 preview(null,'Camera '+(assigned||'A·B·C')+' capture pending');
 if(assigned)$('view-title').textContent='Camera '+assigned;
 else{$('open-compose').hidden=true}
 refreshVenue();setInterval(refreshVenue,1500);
}else{pickView(selected)}
if(wall){document.body.classList.add('wall');$('view-title').textContent='OFFFRAME · Exhibition feed'}
window.addEventListener('storage',event=>{if(!venue&&event.key===postKey){reports=load(postKey,[]);renderFeed()}});
function installPointerHaze(){
 const enabled=matchMedia('(hover:hover) and (pointer:fine) and (prefers-reduced-motion:no-preference)');
 if(wall||!enabled.matches)return;
 const layer=make('div','pointer-haze');
 layer.setAttribute('aria-hidden','true');
 const stamps=Array.from({length:8},()=>make('span',''));
 layer.append(...stamps);document.body.append(layer);
 let index=0,lastX,lastY,lastTime=0;
 window.addEventListener('pointermove',event=>{
  if(event.pointerType!=='mouse'||!enabled.matches)return;
  const {clientX:x,clientY:y,timeStamp:now}=event;
  if(now-lastTime<35||Math.hypot(x-lastX,y-lastY)<13)return;
  lastX=x;lastY=y;lastTime=now;
  const stamp=stamps[index];
  index=(index+1)%stamps.length;
  for(const animation of stamp.getAnimations())animation.cancel();
  stamp.style.transform=`translate3d(${x-50}px,${y-50}px,0)`;
  stamp.animate([{opacity:.78},{opacity:0}],{duration:285,easing:'ease-out'});
 },{passive:true});
}
renderPeople();renderStories();renderFeed();installPointerHaze();
if(!wall){window.addEventListener('hashchange',showLinkedPost);window.addEventListener('load',showLinkedPost)}
</script>
</body>
</html>
