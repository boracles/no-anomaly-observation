<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>잔향 (@no.anomaly) · 이상 없음</title>
<style>
:root{color-scheme:light;--ink:#171717;--dim:#626262;--line:#dedddc;--bg:#fff;--accent:#a72a59;--blue:#2459ad}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
button,a,input,textarea{font:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.55}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
a{color:inherit;text-decoration:none}
svg{width:24px;height:24px;display:block;stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
h1,h2,p,figure{margin:0}
.muted{color:var(--dim)}
.rail{position:fixed;inset:0 auto 0 0;width:64px;padding:28px 9px 17px;display:flex;flex-direction:column;align-items:center;background:var(--bg);z-index:2}
.brand{display:flex;align-items:center;gap:9px;font-size:24px;font-weight:900;letter-spacing:-.085em;width:max-content}
.brand svg{width:25px;height:25px}
.rail .brand{padding:8px}
.rail .brand span{display:none}
.nav{display:grid;gap:18px;margin-top:clamp(15px,20vh,210px);margin-bottom:auto}
.nav svg,.railfoot svg{width:26px;height:26px}
.nav button,.railfoot a{display:grid;place-items:center;width:46px;height:46px;border-radius:8px}
.nav button:hover,.railfoot a:hover{background:#f4f4f4}
.nav .selected svg{stroke-width:2.4}
.nav #home.selected svg{fill:currentColor}
.nav .label,.railfoot .label{display:none}
.mobilebar{display:none}
.shell{padding:20px 24px 64px}
.layout{display:block;width:min(100%,750px);margin-inline:auto}
.stream{min-width:0}
.feedheader{display:flex;align-items:center;justify-content:space-between;gap:10px;width:min(100%,576px);margin-inline:auto}
.feedheader:has(.toolbar-title:empty){display:none}
.toolbar-title{font-weight:700}
.toolbar-title:empty{display:none}
.toolbar-title{font-size:12px;color:var(--dim)}
.stories{display:flex;justify-content:center;gap:clamp(14px,3vw,26px);padding:0 0 36px}
.story{display:grid;justify-items:center;gap:6px;width:106px;min-width:0;padding:0}
.story strong{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:500}
.story .pic{display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:50%;padding:3px;background:linear-gradient(32deg,#ffbd18 4%,#fa254a 46%,#db00be 89%)}
.story img,.story .all{width:100%;height:100%;border:3px solid white;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:#191620;color:white}
.story .all svg{width:27px;height:27px}
.entries{display:grid;gap:13px;width:min(100%,576px);margin-inline:auto}
.post{min-width:0;border-bottom:1px solid var(--line);padding-bottom:9px;scroll-margin-top:65px}
.posthead{display:flex;align-items:center;gap:9px;padding:8px 14px 14px}
.avatar{display:block;width:38px;height:38px;flex:0 0 auto;object-fit:cover;border-radius:50%;background:#211c26}
.handle{display:flex;align-items:baseline;gap:6px;line-height:1.3}
.posthead strong,.caption strong{font-weight:750}
.posthead small{display:block;font-size:11px}
.stamp{color:var(--dim);font-size:12px;white-space:nowrap}
.postphoto{background:#191620;aspect-ratio:4/5;overflow:hidden;border-radius:4px}
.postphoto img{width:100%;height:100%;object-fit:cover;display:block}
.postbody{padding:7px 14px 0}
.actions{display:flex;gap:14px;align-items:center;margin-bottom:3px}
.actions button{padding:4px 0;display:flex;align-items:center}
.actions button:hover{color:var(--dim)}
.actions .like[aria-pressed=true]{color:#dc3055}
.actions button[aria-pressed=true] svg{fill:currentColor}
.actions .bookmark{margin-left:auto}
.likes{display:block;margin-bottom:4px}
.caption,.commentlist{word-break:keep-all;overflow-wrap:anywhere}
.caption strong,.commentlist strong{margin-right:6px}
.tags{color:#314a78;margin-top:3px;font-size:13px}
.commentlist{display:grid;gap:3px;margin-top:4px;font-size:13px}
.reply-toggle{color:var(--dim);padding:6px 0 0;text-align:left;font-size:13px}
.commentform{display:flex;gap:9px;margin-top:8px}
.commentform input{flex:1;min-width:0;border:0;padding:3px 0;background:transparent}
.commentform button{color:var(--blue);font-size:13px;font-weight:700;padding:3px 0}
.commentform button:disabled{visibility:hidden}
.empty{padding:30px 10px;text-align:center;color:var(--dim)}
.account{display:flex;align-items:center;gap:10px}
.account small{display:block;color:var(--dim);font-size:12px}
.people{display:grid;gap:13px;width:min(100%,576px);margin:0 auto 16px;padding:12px 14px;border-bottom:1px solid var(--line)}
.people .avatar{width:33px;height:33px}
.people button{margin-left:auto;color:var(--blue);padding:6px 0;font-size:12px;font-weight:700}
.people button[aria-pressed=true]{color:var(--dim)}
.post-options{margin-left:auto}
.post-options summary{display:grid;place-items:center;cursor:pointer;list-style:none;padding:5px}
.post-options summary::-webkit-details-marker{display:none}
.post-options{position:relative}
.post-options button{position:absolute;z-index:1;right:0;width:max-content;background:white;border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 8px #0002;padding:8px 12px}
.actions .like{gap:5px}
.actions .like span{color:var(--ink);font-size:13px;font-weight:700}
.wall .likes{display:block}
body:not(.wall) .likes{display:none}
.story-view{width:min(430px,calc(100% - 20px));background:#111;color:white;border:0;border-radius:12px;overflow:hidden}
.story-stage{position:relative;display:grid;align-items:end;aspect-ratio:9/15;max-height:calc(100dvh - 20px);isolation:isolate}
.story-stage::after{content:"";position:absolute;inset:0;background:linear-gradient(#000a,transparent 24%,transparent 65%,#000d);z-index:-1}
.story-stage>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.story-top{position:absolute;inset:12px 12px auto}
.story-progress{display:flex;gap:4px;margin-bottom:9px}
.story-progress span{height:2px;flex:1;background:#fff6}
.story-progress .seen{background:white}
.story-person{display:flex;align-items:center;gap:8px}
.story-person .avatar{width:29px;height:29px}
.story-person button{margin-left:auto;padding:5px;font-size:18px}
.story-tap{position:absolute;top:62px;bottom:84px;width:36%;font-size:21px;color:white;text-shadow:0 1px 5px #000}
.story-tap:first-of-type{left:0;text-align:left;padding-left:13px}
.story-tap:last-of-type{right:0;text-align:right;padding-right:13px}
.story-note{padding:14px 15px 18px;font-size:14px}
.story-note button{display:block;margin-top:8px;padding:0;color:white;text-decoration:underline;text-underline-offset:3px;font-size:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);width:max-content;border-radius:8px;background:#252228;color:white;padding:10px 14px;z-index:3}
.wall{color-scheme:dark;--bg:#101011;--ink:#fff;--dim:#b8b7ba;--line:#424047}
.wall :is(.rail,.stories,.actions,.mobilebar,.reply-toggle,.commentform,.post-options){display:none}
.wall .shell{margin:0}
.wall .layout{display:block;max-width:1440px;margin:auto}
.wall .entries{width:100%;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));margin-top:20px}
.wall .toolbar-title{font-size:24px;font-weight:750;color:var(--ink)}
.wall .postphoto{aspect-ratio:16/9}
.wall .postphoto img{object-fit:contain}
.wall .tags{color:#b9caeb}
dialog{width:min(525px,calc(100% - 24px));max-height:calc(100% - 24px);padding:0;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:14px}
dialog::backdrop{background:#0009}
.dialoghead{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--line)}
.dialoghead h2{font-size:16px}
.dialogbody{padding:15px;display:grid;gap:10px}
.choice,.inbox{display:flex;gap:6px;overflow:auto}
.choice button[aria-pressed=true],.inbox button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.preview{background:#f5f4f4;aspect-ratio:16/9;display:grid;place-items:center;text-align:center;color:var(--dim);overflow:hidden;border-radius:6px}
.preview img,.inbox img{width:100%;height:100%;object-fit:cover;display:block}
.inbox button{border:1px solid var(--line);padding:3px;flex:0 0 85px;aspect-ratio:16/9;border-radius:5px}
textarea,input,.ghost{color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 10px}
textarea{width:100%;min-height:64px;resize:vertical}
.primary{border-radius:7px;padding:7px 17px;background:var(--blue);color:white;font-weight:750}
.formend{display:flex;justify-content:space-between;align-items:center}
@media(min-width:901px){body:not(.wall) .layout{position:relative;left:-14px}}
@media(max-height:640px){.nav{margin-top:auto;gap:5px}}
@media(min-width:601px) and (max-width:900px){
 .shell{padding-left:80px}
 .story{width:86px}
}
@media(max-width:600px){
 .rail{inset:auto 0 0;width:auto;border-top:1px solid var(--line);display:block;padding:3px 12px max(3px,env(safe-area-inset-bottom))}
 .rail .brand,.railfoot{display:none}
 .nav{display:flex;justify-content:space-around;gap:0;margin:0}
 .mobilebar{display:flex;align-items:center;justify-content:space-between;padding:8px 15px;border-bottom:1px solid var(--line)}
 .shell{padding:12px 0 74px}
 .layout{max-width:470px}
 .feedheader{padding-inline:14px}
 .stories{justify-content:flex-start;gap:9px;padding:0 14px 12px}
 .story{width:74px}
 .story .pic{width:61px}
 .story strong{font-size:11px}
 .postphoto{border-radius:0;aspect-ratio:1.29}
 .wall .postphoto{aspect-ratio:16/9}
 .toast{bottom:62px}
 .wall .shell{padding-inline:12px}
}
</style>
</head>
<body>
<template id="icons">
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></symbol>

 <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.7 5.9a4.8 4.8 0 0 0-6.8 0L12 7.8l-1.9-1.9a4.8 4.8 0 0 0-6.8 6.8l8.7 8.4 8.7-8.4a4.8 4.8 0 0 0 0-6.8z"/></symbol>
 <symbol id="i-comment" viewBox="0 0 24 24"><path d="M20.8 11.8a8.8 8.8 0 0 1-12.5 8l-5 1.2 1.1-4.6a8.8 8.8 0 1 1 16.4-4.6z"/></symbol>
 <symbol id="i-camera" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></symbol>
 <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4 20-7ZM11 13 22 2"/></symbol>

 <symbol id="i-more" viewBox="0 0 24 24"><g stroke="none" fill="currentColor"><circle cx="5" cy="12" r="1.65"/><circle cx="12" cy="12" r="1.65"/><circle cx="19" cy="12" r="1.65"/></g></symbol>
</svg>
</template>

</header>
<nav class="rail" aria-label="주 메뉴">
<a class="brand" href="./"><svg aria-hidden="true"><use href="#i-camera"/></svg><span>잔향</span></a>
<div class="nav">
<button id="home" class="selected" aria-label="홈"><svg aria-hidden="true"><use href="#i-home"/></svg><span class="label">홈</span></button>

</nav>
<main class="shell"><div class="layout">

<header class="feedheader">
<span class="toolbar-title" id="view-title"></span>
</header>

</div></main>
<div id="toast" class="toast" role="status" hidden></div>

<div class="story-stage">
<img id="story-image" alt="">
<div class="story-top"><div class="story-progress" id="story-progress" aria-hidden="true"></div>
<div class="story-person"><img class="avatar" id="story-avatar" alt=""><strong id="story-name"></strong><span id="story-time"></span><button id="story-close" aria-label="스토리 닫기">×</button></div></div>
<button class="story-tap" id="story-prev" aria-label="이전 스토리">‹</button>

</div>

<dialog id="composer">

<form id="compose" class="dialogbody">
<div class="choice" id="choices"></div><div class="inbox" id="inbox" hidden></div>
<div class="preview" id="preview">게시할 사진을 고르세요.</div>
<button class="ghost" type="button" id="capture">이 사진 사용</button>
<small id="capture-status" class="muted" role="status"></small>
<small id="storage-note" class="muted">작성한 게시물과 댓글은 이 브라우저에 저장됩니다.</small>
<label for="report">캡션</label><textarea id="report" maxlength="100" placeholder="이 장면에서 무엇을 봤나요?" required></textarea>
<div class="formend"><small class="muted" id="count">0 / 100</small><button class="primary" id="publish" disabled>게시</button></div>
</form>

<script>
document.body.prepend(document.querySelector('#icons').content.cloneNode(true));
const views={
 A:{name:'강우의 경계',tag:'#강우경계',image:'stills/a.jpg'},
 B:{name:'바닥 가까이',tag:'#노면반사',image:'stills/b.jpg'},
 C:{name:'흰 천 바로 옆',tag:'#흰천',image:'stills/c.jpg'}
};
const observers=[
 {view:'C',name:'cloth.under',location:'흰 천 옆'},
 {view:'A',name:'rooftop_03',location:'골목 위층'},
 {view:'B',name:'drainline',location:'골목 바닥'}
];
const nickname='no.anomaly';
let storyIndex=0;
const seed=[
 {id:'seed-c',...observers[0],story:'방금 걷은 건데 다시 걸려 있다.',ago:'방금 전',text:'빨래를 걷으러 내려갔는데 천의 안쪽만 젖어 있었다. 밖에서는 아직 비가 오고 있다.',likes:12,comments:[{name:'drainline',text:'아래에서 찍은 사진에는 젖은 자국이 없어요.'},{name:'rooftop_03',text:'그 천, 어느 쪽이 안쪽이에요?'}]},
 {id:'seed-a',...observers[1],story:'빗소리가 멈춘 뒤에 찍은 사진.',ago:'3분 전',text:'창문을 열고 손을 내밀었다. 손끝 한 마디만 젖었다.',likes:21,comments:[{name:'cloth.under',text:'저는 방금까지 아무 소리도 못 들었어요.'}]},
 {id:'seed-b',...observers[2],story:'방금 이쪽 지나간 사람 있어요?',ago:'8분 전',text:'웅덩이가 골목 끝까지 차 있는데 신발은 마른 채였다.',likes:8,comments:[]}
];
const params=new URLSearchParams(location.search);
const venue=params.get('venue')==='1', wall=params.has('wall');
const assigned=Object.hasOwn(views,params.get('station'))?params.get('station'):null;
const postKey='no-anomaly-records-v1', actionKey='no-anomaly-actions-v2', followKey='no-anomaly-following-v1';
const $=id=>document.getElementById(id);
function load(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
let reports=venue?[]:load(postKey,[]),actions=load(actionKey,{}),following=load(followKey,[]);
let filter='all',mode='feed',selected=assigned||'A',capture=null,inboxKey='',busy=false,openedComment=null,toastTimer;
function save(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch{return false}}
function make(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node}
function image(url,alt){const node=new Image();node.src=url;node.alt=alt;return node}
function icon(id){const node=document.createElementNS('http://www.w3.org/2000/svg','svg');node.setAttribute('aria-hidden','true');const use=document.createElementNS(node.namespaceURI,'use');use.setAttribute('href','#i-'+id);node.append(use);return node}
function notify(message){
 $('toast').textContent=message;
 $('toast').hidden=false;
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>$('toast').hidden=true,2300);
}
function setFilter(value,nextMode='feed'){
 filter=value;mode=nextMode;
 $('following-tab').setAttribute('aria-pressed',String(mode==='following'));
 $('home').classList.toggle('selected',mode==='feed');
 $('following-tab').classList.toggle('selected',mode==='following');
 $('saved-nav').classList.toggle('selected',mode==='saved');
 $('view-title').textContent=mode==='saved'?'저장한 게시물':mode==='following'?'팔로잉':assigned?'카메라 '+assigned:'';
 $('mobile-people').hidden=mode!=='following';
 renderStories();renderFeed();
}
function renderPeople(){
 const target='mobile-people';
 $(target).replaceChildren(...observers.map(person=>{
  const row=make('div','account'),avatar=image(views[person.view].image,'');
  avatar.className='avatar';
  const by=make('div');by.append(make('strong','',person.name),make('small','',person.location));
  const followed=following.includes(person.name),button=make('button','',followed?'팔로잉':'팔로우');
  button.setAttribute('aria-pressed',String(followed));
  button.setAttribute('aria-label',person.name+' 팔로우');
  button.onclick=()=>{
   following=followed?following.filter(name=>name!==person.name):[...following,person.name];
   save(followKey,following);
   renderPeople();renderFeed();
   $(target).querySelectorAll('button')[observers.indexOf(person)].focus();
  };
  row.append(avatar,by,button);return row;
 }));
}
function renderStories(){
 const all={view:'all',name:'모두'};
 $('stories').hidden=mode!=='feed';
 $('stories').replaceChildren(...[all,...observers].map(({view,name})=>{
  const button=make('button','story');button.setAttribute('aria-pressed',String(filter===view));
  const photo=make('span','pic');
  if(view==='all'){
   const mark=make('span','all');mark.append(icon('camera'));photo.append(mark);
  }else photo.append(image(views[view].image,''));
  button.append(photo,make('strong','',name));
  button.onclick=()=>{
   if(view==='all'||venue){setFilter(view);$('stories').querySelector('[aria-pressed="true"]').focus();return}
   showStory(seed.findIndex(entry=>entry.view===view));$('story-view').showModal();
  };
  if(view!=='all'&&!venue)button.setAttribute('aria-label',name+' 스토리');
  return button;
 }));
}
function showStory(index){
 if(index<0||index>=seed.length){$('story-view').close();return}
 storyIndex=index;
 const entry=seed[index],view=views[entry.view];
 $('story-image').src=$('story-avatar').src=view.image;
 $('story-image').alt=view.name;
 $('story-name').textContent=entry.name;
 $('story-time').textContent='· '+entry.ago;
 $('story-caption').textContent=entry.story;
 $('story-prev').hidden=index===0;
 $('story-next').textContent=index===seed.length-1?'×':'›';
 $('story-next').setAttribute('aria-label',index===seed.length-1?'스토리 닫기':'다음 스토리');
 $('story-progress').replaceChildren(...seed.map((_,i)=>make('span',i<=index?'seen':'')));
}
$('story-close').onclick=()=>$('story-view').close();
$('story-prev').onclick=()=>showStory(storyIndex-1);
$('story-next').onclick=()=>showStory(storyIndex+1);
$('story-post').onclick=()=>{
 $('story-view').close();
 $(`post-${seed[storyIndex].id}`)?.scrollIntoView({block:'start'});
};
$('story-view').addEventListener('keydown',event=>{
 if(event.key==='ArrowRight')showStory(storyIndex+1);
 if(event.key==='ArrowLeft'&&storyIndex>0)showStory(storyIndex-1);
});
async function sharePost(id){
 const url=new URL(location.href);url.hash='post-'+id;
 try{
  await navigator.clipboard.writeText(url.href);
  notify('게시물 링크를 복사했습니다.');
 }catch{
  window.prompt('게시물 링크',url.href);
 }
}
function postCard(entry){
 const view=views[entry.view],name=entry.name||nickname,id=entry.id;
 const state=actions[id]||{liked:false,comments:[]};
 const article=make('article','post'),head=make('div','posthead');
 article.id='post-'+id;
 const by=make('div'),handle=make('div','handle');
 handle.append(make('strong','',name),make('span','stamp','· '+(entry.ago||'방금 전')));
 by.append(handle,make('small','',entry.location||'골목'));
 const avatar=image(view.image,'');avatar.className='avatar';
 const options=make('details','post-options'),summary=make('summary','');
 summary.setAttribute('aria-label','게시물 옵션');summary.append(icon('more'));
 const copy=make('button','','게시물 링크 복사');
 copy.onclick=()=>{options.open=false;sharePost(id)};
 options.append(summary,copy);
 head.append(avatar,by,options);
 const photo=make('figure','postphoto');
 photo.append(image(entry.image||view.image,view.name));
 const body=make('div','postbody'),buttons=make('div','actions');
 const like=make('button','like'),likes=make('strong','likes');
 const likeCount=make('span','');
 like.append(icon('heart'),likeCount);like.setAttribute('aria-label','좋아요');
 function updateLike(){
  like.setAttribute('aria-pressed',String(Boolean(state.liked)));
  const count=(entry.likes||0)+(state.liked?1:0);
  likeCount.textContent=String(count);
  likes.textContent='좋아요 '+count+'개';
 }
 like.onclick=()=>{state.liked=!state.liked;actions[id]=state;save(actionKey,actions);updateLike()};
 updateLike();
 if(!wall)photo.ondblclick=()=>{if(!state.liked)like.click()};
 const replies=[...(entry.comments||[]),...(state.comments||[])];
 const comments=make('button','');comments.append(icon('comment'));comments.setAttribute('aria-label','댓글');comments.setAttribute('aria-expanded',String(openedComment===id));
 const share=make('button','');share.append(icon('send'));share.setAttribute('aria-label','게시물 링크 복사');share.onclick=()=>sharePost(id);
 const bookmark=make('button','bookmark');bookmark.append(icon('bookmark'));bookmark.setAttribute('aria-label','게시물 저장');bookmark.setAttribute('aria-pressed',String(Boolean(state.saved)));
 bookmark.onclick=()=>{
  state.saved=!state.saved;actions[id]=state;save(actionKey,actions);
  bookmark.setAttribute('aria-pressed',String(state.saved));
  notify(state.saved?'게시물을 저장했습니다.':'저장을 취소했습니다.');
  if(mode==='saved')renderFeed();
 };
 comments.onclick=()=>{
  openedComment=openedComment===id?null:id;renderFeed();
  (document.getElementById('reply-'+id)||document.getElementById(article.id)?.querySelector('[aria-label="댓글"]'))?.focus({preventScroll:!openedComment});
 };
 buttons.append(like,comments,share,bookmark);
 const caption=make('p','caption');caption.append(make('strong','',name),document.createTextNode(entry.text));
 body.append(buttons,likes,caption,make('p','tags',view.tag+'  #이상없음'));
 if(replies.length>1&&openedComment!==id){
  const toggle=make('button','reply-toggle','댓글 '+replies.length+'개 모두 보기');
  toggle.onclick=comments.onclick;
  body.append(toggle);
 }
 if(replies.length){
  const list=make('div','commentlist');
  for(const reply of (openedComment===id?replies:replies.slice(0,1))){const line=make('p');line.append(make('strong','',reply.name),document.createTextNode(reply.text));list.append(line)}
  body.append(list);
 }
 if(!wall){
  const form=make('form','commentform'),input=make('input','');
  input.id='reply-'+id;input.placeholder='댓글 달기…';input.setAttribute('aria-label','댓글');input.maxLength=100;input.required=true;
  const replyButton=make('button','','게시');replyButton.disabled=true;
  input.oninput=()=>{replyButton.disabled=!input.value.trim()};
  form.append(input,replyButton);
  form.onsubmit=event=>{
   event.preventDefault();const value=input.value.trim();if(!value)return;
   state.comments=[...(state.comments||[]),{name:nickname,text:value}];actions[id]=state;save(actionKey,actions);
   openedComment=id;renderFeed();$('reply-'+id)?.focus({preventScroll:true});
  };
  body.append(form);
 }
 article.append(head,photo,body);return article;
}
function renderFeed(){
 const rows=(venue?reports:[...reports,...seed]).filter(entry=>{
  if(!views[entry.view])return false;
  if(mode==='saved')return actions[entry.id]?.saved;
  if(mode==='following')return following.includes(entry.name);
  return filter==='all'||entry.view===filter;
 });
 const message=mode==='saved'?'저장한 게시물이 없습니다.':mode==='following'?'함께 본 사람들을 팔로우해 보세요.':'아직 게시된 기록이 없습니다.';
 $('entries').replaceChildren(...(rows.length?rows.map(postCard):[make('p','empty',message)]));
}
function showLinkedPost(){
 const id=location.hash.slice(1);
 if(!id.startsWith('post-'))return;
 setFilter('all');
 $(id)?.scrollIntoView({block:'start'});
}
function updateCompose(){
 $('count').textContent=$('report').value.length+' / 100';
 $('publish').disabled=busy||!capture||!$('report').value.trim();
}
function preview(url,text){$('preview').replaceChildren(url?image(url,text):document.createTextNode(text))}
function pickView(key){
 selected=key;capture=null;
 for(const node of $('choices').children)node.setAttribute('aria-pressed',String(node.dataset.view===key));
 preview(views[key].image,views[key].name);$('capture-status').textContent='게시할 사진을 선택하세요.';updateCompose();
}
function openComposer(){
 if(venue&&!assigned)return;
 $('composer').showModal();
 if(venue){$('compose-title').textContent='태블릿 '+assigned+' · 기록 올리기';refreshVenue()}
}
for(const [key,view] of Object.entries(views)){
 if(assigned&&assigned!==key)continue;
 const button=make('button','ghost',venue?'카메라 '+key:view.name);button.type='button';button.dataset.view=key;button.onclick=()=>pickView(key);$('choices').append(button);
}
$('capture').onclick=()=>{capture={view:selected};$('capture-status').textContent='사진을 선택했습니다.';$('report').focus();updateCompose()};
$('open-compose').onclick=openComposer;
$('close-compose').onclick=()=>$('composer').close();
$('home').onclick=()=>{setFilter('all');window.scrollTo(0,0)};
$('following-tab').onclick=()=>setFilter('all','following');
$('saved-nav').onclick=()=>{setFilter('all','saved');window.scrollTo(0,0)};
$('report').oninput=updateCompose;
$('compose').onsubmit=async event=>{
 event.preventDefault();
 const message=$('report').value.trim();
 if(!capture||!message||busy)return;
 busy=true;updateCompose();
 try{
  if(venue){
   const response=await fetch('/api/publish/'+assigned,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:capture.id,text:message})});
   if(!response.ok)throw new Error('게시 실패');
   inboxKey='';await refreshVenue();
  }else{
   const next=[{id:crypto.randomUUID(),view:capture.view,name:nickname,text:message},...load(postKey,[])].slice(0,40);
   if(!save(postKey,next))throw new Error('저장 실패');
   reports=next;
  }
  $('report').value='';capture=null;$('composer').close();setFilter('all');window.scrollTo(0,0);
 }catch{$('capture-status').textContent='게시할 수 없습니다. 연결을 확인해 다시 시도하세요.'}
 finally{busy=false;updateCompose()}
};
async function refreshVenue(){
 try{
  const response=await fetch('/api/feed');if(!response.ok)throw Error();
  const next=await response.json();
  if(JSON.stringify(next)!==JSON.stringify(reports)){const firstFeed=!reports.length;reports=next;renderFeed();if(firstFeed&&!wall)showLinkedPost()}
  if(wall||!assigned)return;
  const pending=await fetch('/api/captures/'+assigned);if(!pending.ok)throw Error();
  const photos=await pending.json(),nextKey=photos.map(photo=>photo.id).join(',');
  if(inboxKey===nextKey)return;
  inboxKey=nextKey;
  if(capture&&!photos.some(photo=>photo.id===capture.id)){capture=null;updateCompose()}
  if(!capture)preview(null,photos.length?'관측기 '+assigned+'에서 도착한 사진을 고르세요.':'관측기 '+assigned+'의 촬영을 기다리는 중');
  $('inbox').replaceChildren(...photos.map((photo,i)=>{
   const button=make('button','');button.type='button';button.setAttribute('aria-label','사진 '+(i+1));
   button.setAttribute('aria-pressed',String(capture?.id===photo.id));button.append(image(photo.image,'관측기 '+assigned+' 촬영'));
   button.onclick=()=>{capture=photo;for(const node of $('inbox').children)node.setAttribute('aria-pressed',String(node===button));preview(photo.image,'관측기 '+assigned+' 촬영');$('report').focus();updateCompose()};
   return button;
  }));
 }catch{if(!wall)$('capture-status').textContent='전시장 서버 연결을 확인하세요.'}
}
if(venue){
 $('storage-note').hidden=true;
 $('wall-link').href=$('wall-mobile').href='?venue=1&wall=1';
 $('choices').hidden=$('capture').hidden=true;$('inbox').hidden=false;
 preview(null,'관측기 '+(assigned||'A·B·C')+'의 촬영을 기다리는 중');
 if(assigned)$('view-title').textContent='관측기 '+assigned;
 else{$('open-compose').hidden=true}
 refreshVenue();setInterval(refreshVenue,1500);
}else{pickView(selected)}
if(wall){document.body.classList.add('wall');$('view-title').textContent='잔향 · 현장 피드'}
window.addEventListener('storage',event=>{if(!venue&&event.key===postKey){reports=load(postKey,[]);renderFeed()}});
renderPeople();renderStories();renderFeed();
if(!wall){window.addEventListener('hashchange',showLinkedPost);window.addEventListener('load',showLinkedPost)}
</script>
</body>
</html>
